name: Validate protected canary
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: node --check scripts/canary.mjs
      - run: node --check scripts/source-pins.mjs
      - run: node scripts/canary.mjs validate
      - run: node --test scripts/publication.test.mjs
